name: Stage Fern Documentation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to stage (must contain Fern documentation)
        required: true
        type: string

permissions:
  contents: write

jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    uses: ./.github/workflows/docs-site.yml
    with:
      channel: release
      source_ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
      release_tag: ${{ inputs.tag || github.event.release.tag_name }}
      mode: preview
    secrets: inherit
